name: Publish Mirrored Dungeon TC-02 Tactical Combat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pass115-rc7.yml
      - godot-poc/**
      - web/**

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify locally tested TC-02 production export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out production export and matching source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            godot-poc
            web
      - name: Verify release identity, source and web hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          site = pathlib.Path('web')
          manifest = json.loads((site / 'release-manifest.json').read_text())
          info = json.loads((site / 'build-info.json').read_text())
          assert manifest['release'] == info['pass'] == 'TC-02'
          assert 'TC-02' in (pathlib.Path('godot-poc/scripts/interface.gd')).read_text()
          assert set(p.name for p in site.iterdir()) == set(manifest['files']) | {'release-manifest.json'}
          for name, record in manifest['files'].items():
              assert pathlib.Path(name).name == name
              data = (site / name).read_bytes()
              assert len(data) == record['bytes'] and hashlib.sha256(data).hexdigest() == record['sha256'], name
          text_ext = {'.gd','.uid','.gdshader','.import','.tscn','.json','.godot','.cfg','.md'}
          for name, digest in manifest['source'].items():
              file = pathlib.Path('godot-poc') / name
              assert file.resolve().is_relative_to(pathlib.Path('godot-poc').resolve())
              data = file.read_bytes()
              if file.suffix in text_ext or file.name == '.gitignore': data = data.replace(b'\r\n', b'\n')
              assert hashlib.sha256(data).hexdigest() == digest, name
          digest = hashlib.sha256(json.dumps(manifest['source'], sort_keys=True).encode()).hexdigest()
          assert digest == manifest['sourceSha256'] == info['sourceSha256']
          assert (site / 'index.wasm').read_bytes()[:4] == b'\0asm'
          assert (site / 'index.pck').stat().st_size > 1000000
          assert 'TC-02' in (site / 'index.html').read_text()
          print('Verified exact locally tested TC-02 export and matching corrected source.')
          PY
      - name: Upload playable Web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Deploy Pass TC-02
        id: deployment
        uses: actions/deploy-pages@v4

